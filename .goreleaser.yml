# goreleaser config — release cross-compile matrix.
# byob-release.4 + byob-release.6: -trimpath always, -s -w on release only.
# Dev builds (make build) keep symbols; release strips them here.
#
# windows is intentionally excluded — internal/runner/claude.go uses
# syscall.SysProcAttr.Setpgid/syscall.Kill without build tags (ralph-gbu).
# ralph is Linux-only at runtime per isolation, but darwin compiles and
# version/docs subcommands work cross-platform.
version: 2

project_name: ralph

builds:
  - id: ralph
    main: ./cmd/ralph
    binary: ralph
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jcrussell/ralph/internal/ralphcmd/build.Version={{.Version}}
      - -X github.com/jcrussell/ralph/internal/ralphcmd/build.Commit={{.FullCommit}}
      - -X github.com/jcrussell/ralph/internal/ralphcmd/build.Date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# byob-security.3: one CycloneDX SBOM per archive via syft. Default goreleaser
# sbom output is SPDX; we override args to emit CycloneDX so consumers can feed
# the file straight into common vuln scanners.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.cdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

# byob-security.3: cosign keyless signing — GitHub's OIDC token authenticates
# to Sigstore, so there are no long-lived keys to manage. Signs every release
# artifact (archives, checksums, sboms) so any downloaded file can be verified
# independently against the workflow that produced it.
signs:
  - cmd: cosign
    artifacts: all
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true
