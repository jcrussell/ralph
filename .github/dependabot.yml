# byob-security.1: Dependabot keeps Go modules and GitHub Actions on
# pinned-but-fresh versions. Upgrades land via PR; nobody types `go get
# example.com/pkg@latest` on a laptop.
version: 2
updates:
  # Group each ecosystem's weekly bumps into a single PR so reviews batch
  # one "deps" diff a week instead of one PR per module/action.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
