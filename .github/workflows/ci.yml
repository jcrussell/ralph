# bead ralph-yjz: every push to main and every PR runs the same quality
# gates that land code locally — `go mod tidy` with a diff check (so a
# hand-edited go.mod is rejected), `go vet`, and race tests.
#
# `make lint` is intentionally NOT wired here yet: there are pre-existing
# golangci-lint findings (one G302 perm, one revive stutter on
# build.BuildInfo, one staticcheck ST1023). Once those land, add the
# step using golangci/golangci-lint-action pinned by SHA.
#
# byob-security.5: third-party actions are pinned by commit SHA (not
# tag) so a moved tag can't silently swap the action's code;
# workflow-level permissions default to none, jobs opt into the minimum
# they need.
#
# byob-security.1: tool versions (Go toolchain) are exact — never
# `latest` or a floating ref. Dependabot bumps them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: tidy diff check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: make vet
      - name: test
        run: make test
