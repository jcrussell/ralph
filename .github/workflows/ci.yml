# bead ralph-yjz: every push to main and every PR runs the same quality
# gates that land code locally — `go mod tidy` with a diff check (so a
# hand-edited go.mod is rejected), `go vet`, race tests, and lint.
#
# byob-security.2: govulncheck scans the reachable call graph for
# known CVEs (stdlib + deps). A finding fails the build — by the
# time govulncheck lists a CVE, a fix exists.
#
# byob-security.5: third-party actions are pinned by commit SHA (not
# tag) so a moved tag can't silently swap the action's code;
# workflow-level permissions default to none, jobs opt into the minimum
# they need.
#
# byob-security.1: tool versions (Go toolchain, golangci-lint) are
# exact — never `latest` or a floating ref. Dependabot bumps them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: tidy diff check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: make vet
      # .golangci-version is the single source of truth shared with `make lint`
      # so CI and laptops can't drift onto different golangci-lint versions.
      - name: read golangci-lint floor
        id: lintver
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: ${{ steps.lintver.outputs.version }}
      - name: test
        run: make test

  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  # Validate .goreleaser.yml on every push/PR so config breakage surfaces here
  # instead of at `git tag` time when the release workflow is the first to run it.
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.14.1
          args: check
