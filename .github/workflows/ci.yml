# bead ralph-yjz: every push to main and every PR runs the same quality
# gates that land code locally — `go mod tidy` with a diff check (so a
# hand-edited go.mod is rejected), `go vet`, race tests, and lint.
#
# byob-security.2: govulncheck scans the reachable call graph for
# known CVEs (stdlib + deps). A finding fails the build — by the
# time govulncheck lists a CVE, a fix exists.
#
# byob-security.5: third-party actions are pinned by commit SHA (not
# tag) so a moved tag can't silently swap the action's code;
# workflow-level permissions default to none, jobs opt into the minimum
# they need.
#
# byob-security.1: tool versions (Go toolchain, golangci-lint) are
# exact — never `latest` or a floating ref. Dependabot bumps them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
      - name: tidy diff check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: make vet
      - name: lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
      - name: test
        run: make test

  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
