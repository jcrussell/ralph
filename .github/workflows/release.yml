# byob-release.5: tag-triggered goreleaser. A clean checkout with a pinned Go
# toolchain mints reproducible releases; running goreleaser from a laptop
# bakes in laptop-specific env. Go version tracks go.mod's `go` directive.
#
# byob-security.5: third-party actions are pinned by commit SHA (not tag) so a
# moved tag can't silently swap the action's code; workflow-level permissions
# default to none, jobs opt into the minimum they need.
#
# byob-security.1: the goreleaser binary is pinned to an exact version (not
# `latest`) so a release run today and a re-run six months later produce the
# same toolchain. Dependabot's github-actions ecosystem bumps it.
#
# byob-security.3: syft + cosign produce SBOMs and keyless signatures during
# the release. id-token:write lets cosign request a short-lived OIDC token
# from GitHub and exchange it with Sigstore — no long-lived signing keys.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish release assets
      id-token: write   # OIDC token for cosign keyless signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
