# byob-release.5: tag-triggered goreleaser. A clean checkout with a pinned Go
# toolchain mints reproducible releases; running goreleaser from a laptop
# bakes in laptop-specific env. Go version tracks go.mod's `go` directive (1.26).
#
# byob-security.5: third-party actions are pinned by commit SHA (not tag) so a
# moved tag can't silently swap the action's code; workflow-level permissions
# default to none, jobs opt into the minimum they need.
#
# byob-security.1: the goreleaser binary is pinned to an exact version (not
# `latest`) so a release run today and a re-run six months later produce the
# same toolchain. Dependabot's github-actions ecosystem bumps it.
#
# byob-security.3: syft + cosign produce SBOMs and keyless signatures during
# the release. id-token:write lets cosign request a short-lived OIDC token
# from GitHub and exchange it with Sigstore — no long-lived signing keys.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Gate the publish on a snapshot binary that actually runs. ralph injects its
  # version via -ldflags -X build.Version (Makefile / .goreleaser.yml); if that
  # path ever drifts the binary silently falls back to the VersionDev "dev"
  # sentinel (internal/ralphcmd/build/build.go). The semver check below fails the
  # release before publish instead of shipping a binary that reports "dev".
  smoke:
    name: smoke-test release binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: build snapshot binary
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.14.1
          args: build --snapshot --single-target --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke-test (--version, --help, fsm graph)
        run: |
          set -euo pipefail
          bin="$(find "$PWD/dist" -type f -name ralph -perm -u+x | head -n1)"
          if [ -z "$bin" ]; then
            echo "::error::ralph binary not found under dist/"
            exit 1
          fi
          echo "smoke-testing $bin"
          version_out="$("$bin" --version)"
          echo "$version_out"
          # Root --version template is "ralph {{.Version}}\n" (pkg/cmd/root/root.go).
          # The snapshot template embeds a semver; a "dev" fallback means ldflags
          # injection broke, so reject anything without a semver prefix.
          if ! echo "$version_out" | grep -qE '^ralph [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::--version output '$version_out' is missing a semver — ldflags injection broken?"
            exit 1
          fi
          "$bin" --help > /dev/null
          "$bin" fsm graph > /dev/null

  goreleaser:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: write   # publish release assets
      id-token: write   # OIDC token for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
