# byob-release.5: tag-triggered goreleaser. A clean checkout with a pinned Go
# toolchain mints reproducible releases; running goreleaser from a laptop
# bakes in laptop-specific env. Go version tracks go.mod's `go` directive.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
